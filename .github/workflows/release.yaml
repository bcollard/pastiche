name: Release

# Push a tag like v1.2.3 to build a universal, signed and notarized Pastiche.app,
# publish it as a GitHub release, and update the Homebrew cask in
# bcollard/homebrew-pastiche.
#
# Run it by hand from the Actions tab to test the whole build, signing and
# notarization without publishing anything: the result is a downloadable artifact.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version stamped into a test build (nothing is released)'
        default: '0.0.0-test'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap checks on a Linux runner, so a missing secret fails in seconds
  # instead of after a macOS build.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-rc1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Check the required secrets exist
        env:
          EVENT: ${{ github.event_name }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          required="DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD"
          # Only a real release writes to the tap.
          if [ "$EVENT" = "push" ]; then required="$required HOMEBREW_TAP_TOKEN"; fi
          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. See 'Releasing' in the README."
            exit 1
          fi

  build:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the build number comes from the commit count

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Let codesign use the key without a GUI prompt, which CI cannot answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null

          # Put it first in the search list, keeping the runner's own keychains.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          make release \
            VERSION="$VERSION" \
            BUILD="$GITHUB_RUN_NUMBER" \
            NOTARY_ARGS="--apple-id $NOTARY_APPLE_ID --team-id $NOTARY_TEAM_ID --password @env:NOTARY_PASSWORD"

      - name: Verify what will be shipped
        run: |
          app="dist/Pastiche.app"
          echo "architectures: $(lipo -archs "$app/Contents/MacOS/Pastiche")"
          lipo "$app/Contents/MacOS/Pastiche" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          ( cd dist && shasum -a 256 -c "Pastiche-${VERSION}.zip.sha256" )

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/Pastiche-${{ needs.preflight.outputs.version }}.zip
            dist/Pastiche-${{ needs.preflight.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  # Only for a pushed tag. Kept apart from the build so the signing secrets and
  # the tap token never sit in the same job.
  release:
    needs: [preflight, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Publish the GitHub release
        run: |
          # Re-running a failed release must not fail on "already exists".
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Pastiche ${VERSION}" --generate-notes --verify-tag
          fi

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: bcollard/homebrew-pastiche
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Point the cask at this release
        working-directory: tap
        run: |
          sha="$(cut -d' ' -f1 "../dist/Pastiche-${VERSION}.zip.sha256")"
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::'$sha' does not look like a sha256"
            exit 1
          fi
          sed -i -E \
            -e "s/^(  version )\".*\"/\1\"${VERSION}\"/" \
            -e "s/^(  sha256 )\".*\"/\1\"${sha}\"/" \
            Casks/pastiche.rb
          # Fail loudly if the substitution did not take.
          grep -q "^  version \"${VERSION}\"" Casks/pastiche.rb
          grep -q "^  sha256 \"${sha}\"" Casks/pastiche.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pastiche.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${VERSION}; nothing to commit"
          else
            git commit -m "pastiche v${VERSION}"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "Released \`${TAG}\`"
            echo ""
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- Cask updated in bcollard/homebrew-pastiche"
          } >> "$GITHUB_STEP_SUMMARY"
